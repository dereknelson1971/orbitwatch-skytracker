name: Build OrbitWatch Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build OrbitWatch.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor and stage web assets
        run: |
          npm install
          npm run prepare-www
          npx cap add android

      - name: Configure Android permissions (GPS + Sensors)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          node -e '
            const fs = require("fs");
            let xml = fs.readFileSync(process.argv[1], "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.INTERNET\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
            ];
            for (const p of perms) {
              const name = p.match(/android:name="([^"]+)"/)[1];
              if (!xml.includes(name)) {
                xml = xml.replace("<application", "    " + p + "\n    <application");
              }
            }
            fs.writeFileSync(process.argv[1], xml);
          ' "$MANIFEST"
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare OrbitWatch.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OrbitWatch.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitWatch-APK
          path: OrbitWatch.apk
          retention-days: 90

      - name: Publish OrbitWatch.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: OrbitWatch Android APK (Pixel)
          body: |
            Download **OrbitWatch.apk** directly onto your Pixel phone and tap to install.
            Includes Top-Down Orbital Approach Radar (`Moving Closer` vs `Moving Away`), First-Person AR Sky View with Moon & Planets, Live Phone Compass/Gyro, and GPS support.
          files: OrbitWatch.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
